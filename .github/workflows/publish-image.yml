name: Publish Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/phala-network/phala-inference-guard

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release source and unused image version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          revision=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$revision" origin/main
          echo "SOURCE_REVISION=$revision" >> "$GITHUB_ENV"
          token=$(curl --fail --silent --show-error 'https://ghcr.io/token?service=ghcr.io&scope=repository:phala-network/phala-inference-guard:pull' | jq -er '.token')
          for tag in "$GITHUB_REF_NAME" "${GITHUB_REF_NAME}-${revision:0:12}"; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/phala-network/phala-inference-guard/manifests/$tag")
            if [ "$status" != 404 ]; then
              echo "Refusing publication of $tag: registry status $status (only a missing version may be published)." >&2
              exit 1
            fi
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and validate the release image
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
          EXPECTED_REVISION: ${{ env.SOURCE_REVISION }}
        run: tools/validate-production-image-contract.sh
      - name: Publish the validated image
        shell: bash
        run: |
          set -euo pipefail
          revision_tag="${GITHUB_REF_NAME}-${SOURCE_REVISION:0:12}"
          docker tag pig-production-contract:local "$IMAGE_NAME:$GITHUB_REF_NAME"
          docker tag pig-production-contract:local "$IMAGE_NAME:$revision_tag"
          docker push "$IMAGE_NAME:$GITHUB_REF_NAME"
          docker push "$IMAGE_NAME:$revision_tag"
