name: Publish Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/phala-network/phala-inference-guard

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate production image contract
        env:
          EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: tools/validate-production-image-contract.sh
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
